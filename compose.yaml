services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    networks: [aqyl]

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    init: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    networks: [aqyl]

networks:
  aqyl:
