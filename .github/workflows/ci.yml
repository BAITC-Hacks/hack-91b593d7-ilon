name: Infrastructure checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_PROVIDER: demo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: demo
      WEB_PORT: '3100'
      API_PORT: '8100'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check both services and same-origin proxy
        run: |
          curl --fail --silent http://127.0.0.1:8100/health
          curl --fail --silent http://127.0.0.1:3100/health
          curl --fail --silent http://127.0.0.1:3100/api/health
          curl --fail --silent http://127.0.0.1:3100/api/catalog > /dev/null
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Check actual backend outage and recovery
        run: |
          docker compose stop backend
          curl --fail --silent http://127.0.0.1:3100/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/api/health)" = "502"
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:3100/api/health
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: infrastructure-diagnostics
          path: |
            artifacts/
            frontend/playwright-report/
            frontend/test-results/
      - name: Stop containers
        if: always()
        run: docker compose down
